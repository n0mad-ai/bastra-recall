    get:
      operationId: taskList
      summary: Authenticated task taskList
      description: Mapped task bearer required on every request, including loopback. Agent proposals stay unarmed. Owner review, acknowledgement, resolution and rearm require owner role.
      security: [{ taskBearerAuth: [] }]
      responses:
        "200":
          description: Canonical task result; expected_revision included in task objects
