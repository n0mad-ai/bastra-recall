# Hand-maintained starter spec — written by hand, kept in sync by hand, and
# deliberately kept at that level. It documents the routes a tunnelled client
# needs today; it is not generated from the route table and nothing in the
# build reads it.
#
# Generating this spec from the actual REST routes (plus a drift gate and a
# reference Custom-GPT Action JSON) is tracked separately in issue #13 and is
# not part of this file.
openapi: 3.0.3
info:
  title: Bastra.Recall REST API
  version: 0.8.6
  description: |
    Loopback REST API exposed by the bastra-recall daemon. For hosted clients
    such as ChatGPT Actions, expose `127.0.0.1:6723` through a tunnel and set
    `BASTRA_API_TOKEN`.

    Hand-maintained starter spec — see the comment at the top of this file.
servers:
  - url: http://127.0.0.1:6723/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: Reachability and daemon state
      description: |
        Answers without touching the index, so a client can check that the
        daemon is up and which embedding backend it resolved without spending a
        recall. Unlike the unauthenticated `/health` outside `/api/v1`, this one
        carries auth and CORS headers and is therefore usable from a browser.
      responses:
        "200":
          description: Daemon is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  vault_size:
                    type: integer
                    description: Memories currently indexed.
                  semantic_recall:
                    type: string
                    description: '"on" when an embedding backend is active, else "off".'
                  embedding_mode:
                    type: string
                    description: Resolved provider and model, or "disabled".
  /recall:
    post:
      operationId: recall
      summary: Search memories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
      responses:
        "200":
          description: Recall candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"
  /load_memory:
    post:
      operationId: loadMemory
      summary: Load one memory by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                verbosity:
                  type: string
                  enum: [lean, full]
      responses:
        "200":
          description: Memory content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadMemoryResponse"
  /save_memory:
    post:
      operationId: saveMemory
      summary: Save a new or overwritten memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMemoryRequest"
      responses:
        "200":
          description: Save result
          content:
            application/json:
              schema:
                type: object
                required: [id, file_path, created]
                properties:
                  id:
                    type: string
                  file_path:
                    type: string
                  created:
                    type: boolean
                  summary_note:
                    type: string
  /find_document:
    post:
      operationId: findDocument
      summary: Search document sidecars
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                k:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: Document candidates
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /read_document:
    post:
      operationId: readDocument
      summary: Read one document sidecar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: Document content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /open_document:
    post:
      operationId: openDocument
      summary: Open a document on macOS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: Open result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /save_document:
    post:
      operationId: saveDocument
      summary: Save or link a document sidecar
      description: Requires `BASTRA_DOCUMENT_WRITE=1` on the daemon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Save result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /recategorize_document:
    post:
      operationId: recategorizeDocument
      summary: Update document metadata
      description: Requires `BASTRA_DOCUMENT_WRITE=1` on the daemon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /move_document:
    post:
      operationId: moveDocument
      summary: Move a document sidecar and original file reference
      description: Requires `BASTRA_DOCUMENT_WRITE=1` on the daemon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Move result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RecallRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        k:
          type: integer
          minimum: 1
          maximum: 20
        scope:
          type: string
        type:
          type: string
        expand_hops:
          type: integer
          enum: [0, 1]
        verbosity:
          type: string
          enum: [lean, full]
        min_score:
          type: number
          description: >
            Drop hits below this score. Meaningful in BM25-only mode, where the
            score is a genuine BM25 quantity. On the hybrid path the score is a
            scaled reciprocal-rank sum and this floor practically never fires —
            use weak_result / no_home instead of tightening it.
    RecallResponse:
      type: object
      required: [query, vault_size, hits, recall_id, latency_ms]
      properties:
        query:
          type: string
        vault_size:
          type: integer
        recall_id:
          type: string
        latency_ms:
          type: integer
        hits:
          type: array
          items:
            $ref: "#/components/schemas/RecallHit"
        weak_result:
          type: boolean
          description: >
            Hybrid path only. Present and true when no returned hit anchors
            lexically — neither a hand-written recall_when match nor a title
            match. The hybrid score is a rank quantity, so a top hit is high by
            construction even for a nonsense query; this flag is what says the
            high score is rank-1-of-nothing. Absent means "not weak" — it is
            never sent as false, which keeps the lean payload lean. Purely
            informational: it filters nothing.
        no_home:
          type: boolean
          description: >
            Strict subset of weak_result. Present and true when the top hit
            additionally lives in only ONE of the two retrieval arms, which is
            the shape a genuinely absent fact takes. Kept separate from
            weak_result because it is a higher-confidence claim.
        score_kind:
          type: string
          enum: [rrf, bm25]
          description: >
            Which space hits[].score lives in — read this BEFORE applying any
            band. "rrf" is the fused reciprocal-rank sum: bounded, and the
            30/50/100 bands describe something. "bm25" is raw MiniSearch:
            open-ended (six figures on a real vault), so 100 means nothing and
            every hit would read as REQUIRED. A machine without an embedding
            model serves "bm25" on every call.
        unfused:
          type: boolean
          description: >
            Short form of score_kind == "bm25" — the fusion did not run. Sent
            only when true.
        score_arms:
          type: array
          items:
            type: string
          description: >
            Which arms formed the number, sorted. Two scores are comparable
            only within the same arm set: ["bm25","vector"] tops out at
            163.934, ["bm25","commons","vector"] at 241.803 (the Bastra Commons
            contribute a third arm), and the degraded collapse path
            ["commons","personal-rank"] at 147.541. Consumers that compare
            scores across arm sets must re-fuse by RANK instead.
        score_version:
          type: string
          description: >
            Version of the score FORMULA. It changes when the same arm set
            starts producing a different number; scores are not comparable
            across versions.
        degraded:
          type: string
          enum: [vector-arm-timeout, vector-arm-error, vector-arm-empty]
          description: >
            Present when the fusion fell back to BM25-only DURING this call,
            and why. Distinct from a permanently absent embedding model, which
            simply serves score_kind "bm25" without this field.
        merged_by:
          type: string
          enum: [score, query-rank-fusion]
          description: >
            Batch mode (queries[]) only. "score" means every phrasing returned
            the same score_arms/score_version, so the numbers were directly
            comparable. "query-rank-fusion" means they did not: the order comes
            from the ranks of the sub-lists, the reported scores are genuine
            single-query values in DIFFERENT spaces, and the response is
            flagged unfused — order is meaningful, the numbers are not a band.
    RecallHit:
      type: object
      required: [id, title, type, scope, summary, score]
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        scope:
          type: string
        summary:
          type: string
        score:
          type: number
          description: >
            Read together with the response-level score_kind / score_arms —
            the number alone does not name its scale.
        rrf:
          type: object
          description: >
            verbosity "full" only: what the score is made of. rank_bm25 /
            rank_vector are the 1-based ranks in the personal arms (null when
            that arm did not carry the hit). When the Bastra Commons
            contributed, rank_commons, commons_weight and personal_score are
            also present — personal_score is what the same recall would have
            served without the commons arm.
          properties:
            rank_bm25:
              type: integer
              nullable: true
            rank_vector:
              type: integer
              nullable: true
            raw:
              type: number
            rank_commons:
              type: integer
            commons_weight:
              type: number
            personal_score:
              type: number
    LoadMemoryResponse:
      type: object
      required: [id, frontmatter, body, file_path]
      properties:
        id:
          type: string
        frontmatter:
          type: object
          additionalProperties: true
        body:
          type: string
        file_path:
          type: string
    SaveMemoryRequest:
      type: object
      required: [title, type, summary, body, topic_path, tags, scope, recall_when]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [lesson, preference, project-fact, meta-working, decision, workflow, reference, user-preference, bookmark, doc]
        summary:
          type: string
        body:
          type: string
        topic_path:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        scope:
          type: string
        recall_when:
          type: array
          items:
            type: string
        sensitivity:
          type: string
          enum: [private, team, public]
        related:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        overwrite:
          type: boolean
