components:
  responses:
    TaskError:
      description: '400 validation; 401 unmapped credential; 403 role/domain; 404 absent; 409 revision/state conflict; 503 storage/lock/unavailable'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, code, retryable, status]
            properties:
              error: { type: string }
              code: { type: string }
              retryable: { type: boolean }
              status: { type: integer, enum: [400, 401, 403, 404, 409, 503] }
  securitySchemes:
    taskBearerAuth:
      type: http
      scheme: bearer
      description: Separate mapped task credential (actor/domains/owner or agent), mandatory even on loopback; legacy bearer is insufficient.
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RecallRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        k:
          type: integer
          minimum: 1
          maximum: 20
        scope:
          type: string
        type:
          type: string
        expand_hops:
          type: integer
          enum: [0, 1]
        verbosity:
          type: string
          enum: [lean, full]
        max_tokens:
          type: integer
          minimum: 1
          description: >
            Optional context budget for this call, in estimated tokens
            (chars/4 — the same estimator the context governor uses, so both
            budgets mean the same number). Hits are emitted in rank order
            until the serialized payload would exceed it; the rest are
            dropped, and the response carries truncated_by_budget plus
            dropped_by_budget. k stays the hard upper bound — the budget can
            only remove hits, never add them. Omitted means no budget, and
            the response is byte-identical to one without the field.
        min_score:
          type: number
          description: >
            Drop hits below this score. Meaningful in BM25-only mode, where the
            score is a genuine BM25 quantity. On the hybrid path the score is a
            scaled reciprocal-rank sum and this floor practically never fires —
            use weak_result / no_home instead of tightening it.
    RecallResponse:
      type: object
      required: [query, vault_size, hits, recall_id, latency_ms]
      properties:
        query:
          type: string
        vault_size:
          type: integer
        recall_id:
          type: string
        latency_ms:
          type: integer
        hits:
          type: array
          items:
            $ref: "#/components/schemas/RecallHit"
        weak_result:
          type: boolean
          description: >
            Hybrid path only. Present and true when no returned hit anchors
            lexically — neither a hand-written recall_when match nor a title
            match. The hybrid score is a rank quantity, so a top hit is high by
            construction even for a nonsense query; this flag is what says the
            high score is rank-1-of-nothing. Absent means "not weak" — it is
            never sent as false, which keeps the lean payload lean. Purely
            informational: it filters nothing.
        truncated_by_budget:
          type: boolean
          description: >
            Present and true when max_tokens dropped ranked hits from this
            response. Absent means the response is complete.
        dropped_by_budget:
          type: integer
          description: >
            How many ranked hits the budget left out. Only sent next to
            truncated_by_budget.
        no_home:
          type: boolean
          description: >
            Strict subset of weak_result. Present and true when the top hit
            additionally lives in only ONE of the two retrieval arms, which is
            the shape a genuinely absent fact takes. Kept separate from
            weak_result because it is a higher-confidence claim.
        score_kind:
          type: string
          enum: [rrf, bm25]
          description: >
            Which space hits[].score lives in — read this BEFORE applying any
            band. "rrf" is the fused reciprocal-rank sum: bounded, and the
            30/50/100 bands describe something. "bm25" is raw MiniSearch:
            open-ended (six figures on a real vault), so 100 means nothing and
            every hit would read as REQUIRED. A machine without an embedding
            model serves "bm25" on every call.
        unfused:
          type: boolean
          description: >
            Short form of score_kind == "bm25" — the fusion did not run. Sent
            only when true.
        score_arms:
          type: array
          items:
            type: string
          description: >
            Which arms formed the number, sorted. Two scores are comparable
            only within the same arm set: ["bm25","vector"] tops out at
            163.934, ["bm25","commons","vector"] at 241.803 (the Bastra Commons
            contribute a third arm), and the degraded collapse path
            ["commons","personal-rank"] at 159.836 (147.541 at the
            default commons weight of 0.8). Consumers that compare
            scores across arm sets must re-fuse by RANK instead.
        score_version:
          type: string
          description: >
            Version of the score FORMULA. It changes when the same arm set
            starts producing a different number; two scores are comparable
            only within the same score_version. "rrf-2" (v1.0.1, dense-arm
            weight 1.5): rank 1 in both arms 163.934, rank 1 in BM25 only
            ≈ 65.6, in the vector arm only ≈ 98.4. "rrf-1" (v1.0.0, equal
            weights): 81.967 for a rank 1 in either single arm.
        degraded:
          type: string
          enum: [vector-arm-timeout, vector-arm-error, vector-arm-empty]
          description: >
            Present when the fusion fell back to BM25-only DURING this call,
            and why. Distinct from a permanently absent embedding model, which
            simply serves score_kind "bm25" without this field.
        merged_by:
          type: string
          enum: [score, query-rank-fusion]
          description: >
            Batch mode (queries[]) only. "score" means every phrasing returned
            the same score_arms/score_version, so the numbers were directly
            comparable. "query-rank-fusion" means they did not: the order comes
            from the ranks of the sub-lists, the reported scores are genuine
            single-query values in DIFFERENT spaces, and the response is
            flagged unfused — order is meaningful, the numbers are not a band.
    RecallHit:
      type: object
      required: [id, title, type, scope, summary, score]
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        scope:
          type: string
        summary:
          type: string
        score:
          type: number
          description: >
            Read together with the response-level score_kind / score_arms —
            the number alone does not name its scale.
        rrf:
          type: object
          description: >
            verbosity "full" only: what the score is made of. rank_bm25 /
            rank_vector are the 1-based ranks in the personal arms (null when
            that arm did not carry the hit). When the Bastra Commons
            contributed, rank_commons, commons_weight and personal_score are
            also present — personal_score is what the same recall would have
            served without the commons arm.
          properties:
            rank_bm25:
              type: integer
              nullable: true
            rank_vector:
              type: integer
              nullable: true
            raw:
              type: number
            rank_commons:
              type: integer
            commons_weight:
              type: number
            personal_score:
              type: number
    LoadMemoryResponse:
      type: object
      required: [id, frontmatter, body, file_path]
      properties:
        id:
          type: string
        frontmatter:
          type: object
          additionalProperties: true
        body:
          type: string
        file_path:
          type: string
    SaveMemoryRequest:
      type: object
      required: [title, type, summary, body, topic_path, tags, scope, recall_when]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [lesson, preference, project-fact, meta-working, decision, workflow, reference, user-preference, bookmark, doc]
        summary:
          type: string
        body:
          type: string
        topic_path:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        scope:
          type: string
        recall_when:
          type: array
          items:
            type: string
        sensitivity:
          type: string
          enum: [private, team, public]
        related:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        overwrite:
          type: boolean
