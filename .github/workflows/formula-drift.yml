# #525 — the live Homebrew formula must match the one in this repository.
#
# distribution/homebrew/bastra-recall.rb is the source of truth for everything
# except `url` and `sha256`; every other change is copied into
# n0mad-ai/homebrew-tap by hand. It had drifted: the live caveat named three
# clients where this repo names four. Nothing noticed, because nothing looked.
#
# This job looks. It cannot fix the tap — that is a different repository — so a
# failure here means: copy the repository formula over, minus the two
# tap-owned lines.
name: formula drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "distribution/homebrew/bastra-recall.rb"
      - "tools/check-tap-drift.mjs"
      - "tools/support-matrix.mjs"
      - ".github/workflows/formula-drift.yml"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Compare the live tap formula with this repository's
        # check-tap-drift exits 1 for real drift and 2 when the live copy could
        # not be fetched. Drift stays a red run. A failed fetch on the daily cron
        # is an annotation instead, so a raw.githubusercontent.com hiccup does
        # not read as drift and train everyone to ignore red; a person who
        # triggered the run (push, dispatch) still gets the failure.
        run: |
          code=0
          node tools/check-tap-drift.mjs || code=$?
          if [ "$code" = "2" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::warning title=formula drift::live tap formula could not be fetched — drift not checked this run"
            exit 0
          fi
          exit "$code"
