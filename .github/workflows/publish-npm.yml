name: Publish npm

on:
  # Auto-publish: creating a GitHub Release (gh release create vX.Y.Z) fires this.
  release:
    types: [published]
  # Manual fallback / dry-run rehearsal.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all release checks but do not publish"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  stub:
    # #350: the compiled hook client (#344), one binary per platform, attached
    # to the release. The npm package never carries the binary — only
    # stub/manifest.json with the sha256 of every asset, generated in `publish`
    # from this job's checksums — and `bastra install claude-code` downloads
    # the host's asset on demand and verifies it against that manifest.
    # Two runners, two targets each: the darwin pair on macOS so `codesign`
    # can prove the ad-hoc signature deno applies (without it the binary does
    # not exec on Apple Silicon at all — measured in #350), the linux pair
    # cross-compiled on ubuntu. No Windows asset: the stub spawns sh/ps, which
    # the Windows milestone owns. Runs on dry-run dispatches too, so the build
    # can be rehearsed without a release.
    name: stub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            native: x86_64-unknown-linux-gnu
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            native: aarch64-apple-darwin
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14"
          cache: npm
      - run: npm ci
      # The stub embeds the statusline bundle (`bastra-hook statusline`, #347)
      # through a static import — the workspace build has to come first.
      - run: npm run build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Compile per target
        working-directory: packages/daemon
        run: |
          for t in ${{ matrix.targets }}; do
            node scripts/build-stub.mjs --target "$t"
          done
      - name: Checksums
        working-directory: packages/daemon/stub
        run: |
          mkdir -p checksums
          for t in ${{ matrix.targets }}; do
            shasum -a 256 "bastra-hook-$t" | tee "checksums/bastra-hook-$t.sha256"
          done
      - name: Verify the macOS signature (ad-hoc, applied by deno compile)
        if: runner.os == 'macOS'
        working-directory: packages/daemon/stub
        run: |
          for t in ${{ matrix.targets }}; do
            codesign --verify --verbose=2 "bastra-hook-$t"
            codesign -dv "bastra-hook-$t" 2>&1 | grep -q 'Signature=adhoc'
          done
      - name: Smoke-run the native binary (an unknown lane must fail open with "{}")
        working-directory: packages/daemon/stub
        run: |
          out=$(printf '' | "./bastra-hook-${{ matrix.native }}" nope)
          test "$out" = "{}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stub-checksums-${{ matrix.os }}
          path: packages/daemon/stub/checksums/*.sha256
          if-no-files-found: error
      - name: Attest build provenance
        if: ${{ github.event_name == 'release' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/daemon/stub/bastra-hook-*
      - name: Attach to release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        working-directory: packages/daemon/stub
        run: gh release upload "$TAG" bastra-hook-* checksums/*.sha256 --clobber

  publish:
    runs-on: ubuntu-latest
    # The manifest below needs every platform's checksum: a release whose
    # fast path silently failed to build is the failure shape this project is
    # named against, so a broken stub build blocks the publish.
    needs: stub
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # OIDC trusted publishing needs npm >= 11.5.1. Node 22 bundles only
          # npm 10.x, so this job used to install npm globally — and a
          # `npm install -g npm@…` cannot be pinned by hash, which Scorecard
          # flagged as an unpinned dependency (PinnedDependenciesID, medium).
          # Node 24 LTS ships npm 11.19.0, so the whole step falls away: the
          # npm that publishes is the one the pinned Node release brought with
          # it. Exact version, not a range — same reason as everywhere else here.
          node-version: "24.20.0"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # #350: stub/manifest.json — the sha256 of every release asset the `stub`
      # job built, shipped inside the daemon package (package.json `files`).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stub-checksums-*
          path: stub-checksums
          merge-multiple: true
      - run: node packages/daemon/scripts/stub-manifest.mjs stub-checksums --out packages/daemon/stub/manifest.json
      - run: npm run check:types
      - run: npm test
      - run: npm run test:update
      - run: npm run smoke
      - run: npm run pack:check

      # #524: one resumable step instead of four independent `npm publish`
      # calls. npm versions are immutable, so a failure in the old third step
      # left core+statusline on the registry and the rerun died on core before
      # it ever reached the daemon. The script preflights every target version,
      # skips a package only after verifying the published artifact IS this
      # release, and keeps the unscoped wrapper last.
      - name: Publish the release set (resumable)
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        run: node scripts/publish-release-set.mjs

  desktop-extension:
    # Claude Desktop Extension (.mcpb): built from the SAME checkout the npm
    # packages were published from (workspace tarballs — no registry
    # propagation race) and attached to the GitHub release as an asset.
    # #281: each bundle ships with a .sha256 file (the CLI verifies it after
    # download) and a Sigstore attestation (`gh attestation verify <file>
    # --repo n0mad-ai/bastra-recall`) — the npm packages already carry
    # --provenance, this closes the same gap for the release asset.
    if: ${{ github.event_name == 'release' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:mcpb:local --workspace=@bastra-recall/daemon
      - name: Checksum the bundle
        working-directory: packages/daemon/mcpb
        run: |
          for f in *.mcpb; do
            sha256sum "$f" > "$f.sha256"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/daemon/mcpb/*.mcpb
      - name: Attach extension to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" packages/daemon/mcpb/*.mcpb packages/daemon/mcpb/*.mcpb.sha256 --clobber

  installer-scripts:
    # Double-click installer + uninstaller (#306): README A) sends non-coders to
    # the latest release for these two files, but they only ever lived in
    # distribution/ — the documented download resolved to nothing. Own job (no
    # build, no `needs`) so the documented entry point is published even if the
    # npm or .mcpb step fails. NOTE: GitHub normalizes spaces in asset names to
    # dots, so they appear as `Install.Bastra.command` / `Uninstall.Bastra.command`.
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Attach installer scripts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "distribution/Install Bastra.command" \
            "distribution/Uninstall Bastra.command" \
            --clobber

  promote:
    # #524: the atomic gate. A release used to be fully public the moment it was
    # created — `/releases/latest` moved immediately, while npm and the three
    # independent asset jobs were still running. The Homebrew tap updater and
    # both one-click installers read `/releases/latest`, and the installers pull
    # `bastra-recall@latest` from npm, so a user opening a brand-new 1.0 page
    # could be handed the OLD npm packages.
    #
    # `scripts/bump.mjs` now stages a stable release with `--latest=false`. The
    # tag and page exist so every job above has something to build and attach
    # to, but the source the tap and the installers consume does not move until
    # this job has verified the complete set: four npm versions on the registry
    # AND tagged `latest`, plus every required release asset. Only then does the
    # release become Latest.
    if: ${{ github.event_name == 'release' }}
    needs: [stub, publish, desktop-extension, installer-scripts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14"
      - name: Verify every npm package of the set is published and on `latest`
        run: node scripts/publish-release-set.mjs --verify
      - name: Verify every required release asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$names"
          missing=0
          # GitHub normalizes the spaces in the .command names to dots.
          for want in \
            bastra-hook-x86_64-unknown-linux-gnu \
            bastra-hook-aarch64-unknown-linux-gnu \
            bastra-hook-x86_64-apple-darwin \
            bastra-hook-aarch64-apple-darwin \
            bastra-hook-x86_64-unknown-linux-gnu.sha256 \
            bastra-hook-aarch64-unknown-linux-gnu.sha256 \
            bastra-hook-x86_64-apple-darwin.sha256 \
            bastra-hook-aarch64-apple-darwin.sha256 \
            Install.Bastra.command \
            Uninstall.Bastra.command
          do
            printf '%s\n' "$names" | grep -qxF "$want" || { echo "missing asset: $want"; missing=1; }
          done
          printf '%s\n' "$names" | grep -q '\.mcpb$' || { echo "missing asset: *.mcpb"; missing=1; }
          printf '%s\n' "$names" | grep -q '\.mcpb\.sha256$' || { echo "missing asset: *.mcpb.sha256"; missing=1; }
          test "$missing" -eq 0
      - name: Promote — move /releases/latest onto this release
        # A prerelease deliberately never becomes Latest; nothing to promote.
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --latest

